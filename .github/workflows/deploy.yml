name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Check for .env and .venv in repo
        run: |
          FOUND_ENV=$(find . -name '.env' -not -path './.git/*' | head -20)
          FOUND_VENV=$(find . -name '.venv' -not -path './.git/*' -type d | head -20)
          
          if [ -n "$FOUND_ENV" ]; then
            echo "❌ .env file(s) found in repo:"
            echo "$FOUND_ENV"
            exit 1
          fi
          
          if [ -n "$FOUND_VENV" ]; then
            echo "❌ .venv directory found in repo:"
            echo "$FOUND_VENV"
            exit 1
          fi
          
          echo "✅ No .env or .venv found"

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v3

      - name: Deploy solara-scheduler
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.SOLARA_BASE64 }}
          SERVER_IP: ${{ secrets.SERVER_IP_1 }}
        run: |
          echo "$SSH_PRIVATE_KEY_BASE64" > SOLARA
          chmod 600 SOLARA
          
          echo "Deploying solara-scheduler to $SERVER_IP..."
          
          for i in {1..10}; do
            if ssh -i SOLARA -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@$SERVER_IP "echo ready" 2>/dev/null; then
              break
            fi
            echo "Waiting for server... ($i/10)"
            sleep 10
          done
          
          rsync -avz --delete \
            -e "ssh -i SOLARA -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'target' \
            --exclude '.env' \
            . ubuntu@$SERVER_IP:/etc/solara-sch/
          
          ssh -i SOLARA -o StrictHostKeyChecking=no ubuntu@$SERVER_IP << 'ENDSSH'
          cd /etc/solara-sch
          cargo install --path .
          echo "✅ solara-scheduler built and installed"
          ENDSSH